name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  ios:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache Xcode build artifacts
        uses: actions/cache@v6
        with:
          path: .build/derived_data
          key: ios-derived-v1-${{ runner.os }}-${{ hashFiles('ios/StandingDesk.xcodeproj/project.pbxproj', 'scripts/verify-ios.sh') }}
          restore-keys: ios-derived-v1-${{ runner.os }}-

      - name: Build and test iPhone app
        run: scripts/verify-ios.sh
