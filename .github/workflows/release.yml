name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Check tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"

      - name: Package release assets
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release"/*.zip \
            "$RUNNER_TEMP/release"/*SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Standing Desk ${GITHUB_REF_NAME#v}" \
            --generate-notes
